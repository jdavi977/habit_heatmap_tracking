[project]
name = "habit-heatmap-tracking"
version = "0.1.0"
description = "Habit heatmap tracker: React frontend + Supabase backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff==0.17.1",
]

[tool.uv]
# An app, not an installable library: install deps only.
package = false

# Ruff: PEP 8.
# Run from the repo root:
#   ruff format .        # auto-format
#   ruff check . --fix   # lint + safe autofixes
[tool.ruff]
# PEP 8 limit for code lines.
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (PEP 8)
    "W",  # pycodestyle warnings (PEP 8)
    "F",  # pyflakes: unused imports/variables, undefined names
    "N",  # pep8-naming
    "I",  # import ordering (PEP 8 grouping: stdlib, third-party, local)
]

[tool.ruff.lint.pycodestyle]
# PEP 8 limit for docstrings and comments.
max-doc-length = 72

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
